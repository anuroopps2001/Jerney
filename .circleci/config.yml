version: 2.1

orbs:
  node: circleci/node@5.1.0
  docker: circleci/docker@2.4.0
  trivy: skedulo/trivy@0.10.0

executors:
  docker-publisher:
    docker:
      - image: cimg/base:stable

jobs:
  lint-test-and-sca:
    parameters:
      component:
        type: string
    docker:
      - image: cimg/node:20.0
    steps:
      - checkout

      - node/install-packages:
          app-dir: << parameters.component >>
          pkg-manager: npm
          install-command: npm ci   # ✅ deterministic install

      - run:
          name: Lint << parameters.component >>
          command: npm run lint
          working_directory: << parameters.component >>

      - run:
          name: Run Tests
          command: npm test
          working_directory: << parameters.component >>

      - run:
          name: SCA Audit
          command: npm audit --audit-level=high
          working_directory: << parameters.component >>

  build-and-scan:
    parameters:
      component:
        type: string
    executor: docker-publisher
    steps:
      - checkout

      - setup_remote_docker:
          docker_layer_caching: true

      - run:
          name: Set SHORT_SHA
          command: echo "export SHORT_SHA=$(echo $CIRCLE_SHA1 | cut -c1-7)" >> $BASH_ENV

      - run:
          name: Docker Login
          command: |
            echo "$DOCKERHUB_PASS" | docker login docker.io -u $DOCKERHUB_USER --password-stdin

      - run:
          name: Build Docker Image
          command: |
            docker build \
              -t docker.io/anuroop21/jerney-<< parameters.component >>:${SHORT_SHA} \
              -t docker.io/anuroop21/jerney-<< parameters.component >>:latest \
              ./<< parameters.component >>

      - trivy/validate:
          image: docker.io/anuroop21/jerney-<< parameters.component >>:${SHORT_SHA}
          severity: CRITICAL
          cve-ignore-list: ""
          exit-code: 1

      - run:
          name: Push Image
          command: |
            docker push docker.io/anuroop21/jerney-<< parameters.component >>:${SHORT_SHA}

            if [ "${CIRCLE_BRANCH}" == "main" ]; then
              docker push docker.io/anuroop21/jerney-<< parameters.component >>:latest
            fi

  update-manifest:
    docker:
      - image: cimg/base:stable
    steps:
      - checkout

      - run:
          name: Update K8s Image Tag
          command: |
            SHORT_SHA=$(echo $CIRCLE_SHA1 | cut -c1-7)

            sed -i "s|image: .*jerney-backend.*|image: docker.io/anuroop21/jerney-backend:${SHORT_SHA}|g" k8s/jerney.yaml
            sed -i "s|image: .*jerney-frontend.*|image: docker.io/anuroop21/jerney-frontend:${SHORT_SHA}|g" k8s/jerney.yaml

            git config user.name "circleci-bot"
            git config user.email "bot@circleci.com"
            git add k8s/jerney.yaml
            git commit -m "ci: update k8s images to ${SHORT_SHA} [skip ci]" || echo "No changes"
            git push origin $CIRCLE_BRANCH

workflows:
  devsecops-pipeline:
    jobs:
      - lint-test-and-sca:
          name: lint-backend
          component: "backend"

      - lint-test-and-sca:
          name: lint-frontend
          component: "frontend"

      - build-and-scan:
          name: build-backend
          component: "backend"
          context: dockerhub-creds
          requires:
            - lint-backend
            - lint-frontend

      - build-and-scan:
          name: build-frontend
          component: "frontend"
          context: dockerhub-creds
          requires:
            - lint-backend
            - lint-frontend

      - update-manifest:
          requires:
            - build-backend
            - build-frontend
          filters:
            branches:
              only:
                - features/first-poc